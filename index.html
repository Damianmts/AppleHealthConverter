<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lokale Apple Health-naar-CSV converter zonder uploads." />
    <title>Apple Health Converter</title>
  </head>
  <body>
    <main class="page">
      <h1>Apple Health Converter</h1>

      <form id="converter-form">
        <label for="file">Bestand (.zip of export.xml)</label>
        <input id="file" name="file" type="file" accept=".zip,.xml,application/zip,text/xml,application/xml" required />

        <fieldset>
          <legend>Periode (laatste 28 dagen)</legend>
          <div class="date-fields">
            <label for="start-date">Startdatum <input id="start-date" name="start-date" type="date" readonly aria-readonly="true" /></label>
            <label for="end-date">Einddatum <input id="end-date" name="end-date" type="date" required /></label>
          </div>
          <p class="hint">Kies een einddatum. De weergegeven startdatum wordt automatisch ingesteld zodat de periode precies 28 kalenderdagen bevat.</p>
        </fieldset>

        <fieldset id="data-types-fieldset" class="data-types-locked">
          <legend>Gegevens <span id="type-lock-label">(vergrendeld)</span></legend>
          <div id="type-options"></div>
        </fieldset>

        <button id="process" type="submit">Verwerken</button>
      </form>

      <section aria-live="polite" aria-atomic="true">
        <h2>Status</h2>
        <p id="status">Kies een bestand om te beginnen.</p>
        <progress id="progress" max="100" value="0" hidden></progress>
      </section>

      <button id="download" type="button" disabled>CSV opslaan</button>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
